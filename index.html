<style>
/* Layout: faixa marrom do jogo no topo com seletor de idioma, 4 passos (print ao lado do texto), conversor de UTC no fim */
:root {
  --bg: #f6f1e7;
  --surface: #fffaf1;
  --surface-2: #ece2cf;
  --line: #dccdb3;
  --fg: #3d2f24;
  --muted: #7a6654;
  --band: #5b4636;
  --band-fg: #fff6e8;
  --teal: #13a9b8;
  --teal-ink: #0b6f7a;
  --mark: #ff5a3c;
  --mark-fg: #ffffff;
  --ok: #2e9d57;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1612; --surface: #261f19; --surface-2: #322920; --line: #44382c;
    --fg: #f1e6d6; --muted: #b6a48f; --band: #3a2c21; --band-fg: #fff3e2;
    --teal: #35c9d6; --teal-ink: #6fe0ea;
    --mark: #ff6b4f; --mark-fg: #1b1612; --ok: #57c27f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1612; --surface: #261f19; --surface-2: #322920; --line: #44382c;
  --fg: #f1e6d6; --muted: #b6a48f; --band: #3a2c21; --band-fg: #fff3e2;
  --teal: #35c9d6; --teal-ink: #6fe0ea;
  --mark: #ff6b4f; --mark-fg: #1b1612; --ok: #57c27f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.6;
}
.wrap {
  max-width: 980px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; letter-spacing: .01em; margin: 0; }

/* Faixa de topo */
.hero {
  background: var(--band);
  color: var(--band-fg);
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 1.25rem);
  padding-bottom: 2.25rem;
}
.langs { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: flex-end; margin-bottom: 1.4rem; }
.langs button {
  font: inherit; font-weight: 800; font-size: .85rem; cursor: pointer;
  color: var(--band-fg); background: transparent;
  border: 2px solid rgba(255,255,255,.28); border-radius: 999px;
  padding: .25rem .75rem;
}
.langs button:hover { border-color: rgba(255,255,255,.6); }
.langs button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }
.langs button:focus-visible { outline: 3px solid var(--band-fg); outline-offset: 2px; }
.hero .eyebrow {
  font-weight: 800; font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; opacity: .8;
}
.hero h1 { font-size: clamp(2rem, 6vw, 3.1rem); line-height: 1.05; margin-top: .4rem; }
.hero p { max-width: 60ch; margin: .9rem 0 0; font-size: 1.05rem; opacity: .92; }
.switch { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; margin-top: 1.4rem; }
.chip {
  font-family: var(--font-display); font-size: 1.05rem;
  padding: .35rem .9rem; border-radius: 10px;
  background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.25);
}
.chip.on { background: var(--teal); border-color: var(--teal); color: #fff; }
.chip small { font-family: var(--font-body); font-weight: 700; font-size: .78rem; opacity: .85; margin-left: .3rem; }
.arrow { font-size: 1.4rem; opacity: .8; }

main { padding-block: 2.5rem 3rem; display: grid; gap: 3rem; }
.gnote {
  margin: 0; font-size: .9rem; color: var(--muted);
  border-left: 3px solid var(--teal); padding: .2rem 0 .2rem .8rem; max-width: 70ch;
}

/* Passos */
.steps { display: grid; gap: 2.75rem; list-style: none; margin: 0; padding: 0; }
.step {
  display: grid;
  grid-template-columns: minmax(0, 270px) minmax(0, 1fr);
  gap: 2rem;
  align-items: start;
}
.step-body { min-width: 0; display: grid; gap: .8rem; }
.num {
  display: inline-flex; align-items: center; gap: .6rem;
  font-weight: 800; font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--teal-ink);
}
.num b {
  font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; letter-spacing: 0;
  width: 2.1rem; height: 2.1rem; border-radius: 50%;
  display: inline-grid; place-items: center;
  background: var(--teal); color: #fff;
}
.step h2 { font-size: clamp(1.45rem, 3.6vw, 1.9rem); line-height: 1.15; }
.step p { margin: 0; max-width: 62ch; }
.step ul { margin: 0; padding-left: 1.2rem; display: grid; gap: .35rem; max-width: 62ch; }
.step p i { color: var(--muted); }
.btn {
  display: inline-block; font-family: var(--font-display); font-size: .95em; line-height: 1.2;
  padding: .05rem .5rem; border-radius: 6px; background: var(--teal); color: #fff; white-space: nowrap;
}
.btn.grey { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }

.note {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: .8rem 1rem; font-size: .95rem; max-width: 62ch;
}
.note strong { color: var(--teal-ink); }

/* Tabela de habilidades */
.skills-scroll { overflow-x: auto; max-width: 62ch; }
.skills { border-collapse: collapse; width: 100%; font-size: .93rem; }
.skills th, .skills td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.skills th { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
.skills td:first-child { font-weight: 800; }
.skills td.v { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--teal-ink); font-weight: 800; }

/* Print com marcações */
.shot-col { display: grid; gap: .5rem; justify-items: center; }
.shot {
  position: relative; margin: 0; width: 100%; max-width: 270px;
  border-radius: 22px; overflow: hidden;
  border: 6px solid #15110e;
  box-shadow: 0 10px 30px rgba(40, 25, 10, .25);
  background: #15110e;
  container-type: inline-size;
}
.shot img { display: block; width: 100%; height: auto; }
.hl {
  position: absolute;
  border: 3px solid var(--mark);
  border-radius: 10px;
  box-shadow: 0 0 0 3px rgba(255, 90, 60, .25);
  animation: pulse 1.8s ease-in-out infinite;
}
.hl span {
  position: absolute; top: -.85rem; right: -.6rem;
  background: var(--mark); color: var(--mark-fg);
  font-family: var(--font-display); font-size: .8rem; line-height: 1;
  padding: .25rem .45rem; border-radius: 8px; white-space: nowrap;
}
.hl.left span { right: auto; left: -.6rem; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(255, 90, 60, .12); } }
@media (prefers-reduced-motion: reduce) { .hl { animation: none; } }
.shot-cap { font-size: .8rem; color: var(--muted); text-align: center; max-width: 270px; }

/* Legendas traduzidas por cima dos prints (cores tiradas dos próprios prints; valem nos dois temas) */
.ovs { position: absolute; inset: 0; pointer-events: none; }
.ov {
  position: absolute; display: flex; align-items: center; justify-content: center; text-align: center;
  overflow: hidden; line-height: 1.12; padding: 0 .7cqw;
  font-family: var(--font-body); font-weight: 800; color: #553b35;
}
.ov.left { justify-content: flex-start; text-align: left; }
.ov.right { justify-content: flex-end; text-align: right; }
.ov.desc { color: #392f26; font-weight: 700; }
.ov.cd { color: #ff3b4b; }
.ov.term { color: #604228; }
.ov.cd, .ov.term { white-space: nowrap; }
.ov.title, .ov.ptitle, .ov.btn, .ov.btntext { font-family: var(--font-display); font-weight: 400; color: #ffffff; }
.ov.title { --o: #0e0701; }
.ov.ptitle { --o: #5c4f3f; }
.ov.btn { --o: #101614; }
.ov.btntext { --o: #212425; }
.ov.title, .ov.ptitle, .ov.btn, .ov.btntext {
  text-shadow:
    -.22cqw 0 var(--o), .22cqw 0 var(--o), 0 -.22cqw var(--o), 0 .22cqw var(--o),
    -.16cqw -.16cqw var(--o), .16cqw -.16cqw var(--o), .16cqw .16cqw var(--o), -.16cqw .16cqw var(--o);
}
.ov.btn {
  border-radius: 1.8cqw; border: .35cqw solid #101614;
  background: linear-gradient(#62e7ed, #30cdd4 48%, #1ba8af);
  box-shadow: inset 0 -.9cqw 0 rgba(0, 0, 0, .14);
}
.ov.btn.grey { background: linear-gradient(#a3a9ad, #767d83 48%, #5f666c); }
.ov.tail { justify-content: flex-start; }
.ov.tail span { white-space: nowrap; flex: none; }

/* Checklist final */
.check-box h2 { font-size: clamp(1.4rem, 3.6vw, 1.8rem); margin-bottom: .8rem; }
.check { display: grid; gap: .5rem; list-style: none; padding: 0; margin: 0; max-width: 65ch; }
.check li { display: flex; gap: .6rem; align-items: baseline; }
.check li::before { content: "✓"; color: var(--ok); font-weight: 800; }

footer { color: var(--muted); font-size: .82rem; padding-block: 0 2.5rem; }

@media (max-width: 680px) {
  .step { grid-template-columns: minmax(0, 1fr); gap: 1.2rem; }
  .shot { max-width: 240px; }
  .langs { justify-content: flex-start; }
}
</style>

</header>

(function () {
  var LANGS = ["en", "pt", "tr", "fr", "es"];
  var W = 943, H = 2048;
  var current = "en";
  var $ = function (id) { return document.getElementById(id); };

  function fill(str, lang) {
    var g = G[lang];
    return str.replace(/\{(\w+)\}/g, function (m, k) { return g[k] != null ? g[k] : m; });
  }

  function drawOverlays(lang) {
    document.querySelectorAll(".ovs").forEach(function (el) { el.remove(); });
    if (lang === "en") return; // inglês: o print original já está certo
    document.querySelectorAll("img[data-shot]").forEach(function (img) {
      var list = OV[img.getAttribute("data-shot")] || [];
      var box = document.createElement("div");
      box.className = "ovs";
      box.setAttribute("aria-hidden", "true");
      list.forEach(function (o) {
        var d = document.createElement("div");
        d.className = "ov " + o.c;
        d.style.left = (o.x / W * 100) + "%";
        d.style.top = (o.y / H * 100) + "%";
        d.style.width = (o.w / W * 100) + "%";
        d.style.height = (o.h / H * 100) + "%";
        d.style.fontSize = o.fs + "cqw";
        if (o.bg) d.style.background = o.bg;
        var span = document.createElement("span");
        span.textContent = fill(o.s, lang);
        if (o.startX != null) span.style.marginLeft = ((o.startX - o.x) / o.w * 100) + "%";
        d.appendChild(span);
        box.appendChild(d);
      });
      img.insertAdjacentElement("afterend", box);
    });
  }

  function apply(lang) {
    if (LANGS.indexOf(lang) < 0) lang = "en";
    current = lang;
    var dict = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i]").forEach(function (el) {
      var v = dict[el.getAttribute("data-i")];
      if (v != null) el.innerHTML = fill(v, lang);
    });
    document.querySelectorAll("[data-g]").forEach(function (el) {
      el.textContent = G[lang][el.getAttribute("data-g")] || "";
    });
    document.querySelectorAll("[data-alt]").forEach(function (el) {
      el.alt = dict[el.getAttribute("data-alt")] || "";
    });
    $("gnote").hidden = !dict.gameNote;
    document.querySelectorAll("#langs button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
    });
    drawOverlays(lang);
    try { localStorage.setItem("buff-lang", lang); } catch (e) {}
  }

  function initialLang() {
    var h = (location.hash || "").replace("#", "");
    if (LANGS.indexOf(h) >= 0) return h;
    try { var s = localStorage.getItem("buff-lang"); if (LANGS.indexOf(s) >= 0) return s; } catch (e) {}
    var n = (navigator.language || "en").slice(0, 2).toLowerCase();
    return LANGS.indexOf(n) >= 0 ? n : "en";
  }

  $("langs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (!b) return;
    var l = b.getAttribute("data-lang");
    apply(l);
    try { history.replaceState(null, "", "#" + l); } catch (err) { location.hash = l; }
  });
  window.addEventListener("hashchange", function () {
    var h = location.hash.replace("#", "");
    if (LANGS.indexOf(h) >= 0 && h !== current) apply(h);
  });

  apply(initialLang());
})();
</script>
